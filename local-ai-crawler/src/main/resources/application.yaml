server:
  port: 12117

spring:
  application:
    name: local-ai-crawler
  threads:
    virtual:
      enabled: true        # JDK21 虚拟线程，提升 IO 密集型爬虫吞吐量

  # ===== PostgreSQL 数据源（持久化每日热榜数据） =====
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://101.132.182.160:5432/ai_knowledge}
    username: ${DB_USERNAME:jianbo}
    password: ${DB_PASSWORD:525826}
    hikari:
      # 公网 PG：中间网络/PG 自身可能在 5~10min 内回收 idle，HikariCP 默认 30min
      # 容易拿到死连接报 "This connection has been closed."。把生命周期压短到 5min，
      # 比中间链路更早主动关掉，可避免上述告警。
      max-lifetime: 300000          # 5 分钟（必须 < PG/网关 idle 超时）
      idle-timeout: 180000          # 3 分钟空闲即归还
      keepalive-time: 120000        # 2 分钟做一次 connectionTestQuery，链路探活
      connection-test-query: SELECT 1
      minimum-idle: 2
      maximum-pool-size: 10

  # ===== Redis（Redisson BloomFilter 持久化去重） =====
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password: spjiyou # 如有密码请配置

  # ===== 启动时自动执行建表 SQL =====
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

# ==================== 爬虫业务配置 ====================
crawler:
  # local-ai-knowledge 知识库服务（数据最终推送目标，爬虫专用接口无需认证）
  knowledge-api:
    base-url: ${KNOWLEDGE_API_BASE_URL:http://localhost:12116}
    api-key: ${CRAWLER_API_KEY:local-dev-crawler-api-key-2026}

  # BloomFilter 布隆过滤器（内存去重）
  bloom-filter:
    expected-insertions: 1000000   # 预计最大条目数
    fpp: 0.001                     # 误判率 0.1%

  # Playwright 无头浏览器配置
  playwright:
    headless: true
    timeout: 30000                 # 页面加载超时（毫秒）

  # 各爬虫 @Scheduled Cron 表达式
  schedule:
    github-trending: "0 0 */2 * * ?"     # 每2小时
    weibo-hot:       "0 0 */1 * * ?"     # 每小时
    zhihu-hot:       "0 0 */1 * * ?"     # 每小时
    bilibili-hot:    "0 0 */3 * * ?"     # 每3小时
    xiaohongshu:     "0 0 */4 * * ?"     # 每4小时
    douyin:          "0 0 */4 * * ?"     # 每4小时

# ==================== XXL-JOB 分布式调度（可选） ====================
xxl:
  job:
    enabled: false                 # 默认关闭，需要分布式调度时开启
    admin:
      addresses: http://localhost:8080/xxl-job-admin
    executor:
      appname: local-ai-crawler
      address:
      ip:
      port: 9999
      logpath: ./logs/xxl-job
      logretentiondays: 30
    accessToken: ${XXL_JOB_ACCESS_TOKEN:default_token}

# ==================== 日志 ====================
logging:
  # 自定义 logback 配置位置（放在 resources/logs/ 下，需显式指定）
  config: classpath:logs/logback-spring.xml
  file:
    # 日志输出目录，支持环境变量 LOG_PATH 覆盖；滚动策略见 logs/logback-spring.xml
    path: ${LOG_PATH:./logs}
  level:
    com.jianbo.crawler: DEBUG
    com.microsoft.playwright: WARN
